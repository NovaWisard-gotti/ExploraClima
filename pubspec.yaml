name: exploraclima
description: >-
  ExploraClima: explorador educativo de futuros climáticos para estudiantes
  universitarios de Ingeniería Ambiental.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Configuración del launcher icon exclusivo de ExploraClima.
# Los PNG de mipmap ya están generados en el repositorio; este bloque permite
# regenerarlos con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/exploraclima_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#101C33"
  adaptive_icon_foreground: "assets/icon/exploraclima_icon_foreground.png"
